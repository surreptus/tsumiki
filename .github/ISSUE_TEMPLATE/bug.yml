name: Bug or accessibility problem
description: The site or the conjugator misbehaves, or something is hard to read or use.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: For the conjugator, include the word and the steps you clicked.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device and theme
      description: For example Firefox on Android, light theme, or a screen reader if you use one.
